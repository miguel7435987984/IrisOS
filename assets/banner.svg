<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>

    <!-- Iris Glowing Ring Gradient -->
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080B11" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 86px;
      letter-spacing: -2px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 1px;
      fill: #94A3B8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38BDF8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Ambient Glow Behind Logo -->
  <circle cx="280" cy="210" r="180" fill="url(#nebulaGlow)"/>

  <!-- Iris Emblem / Icon -->
  <g transform="translate(160, 90)">
    <!-- Outer Glow -->
    <circle cx="120" cy="120" r="88" fill="none" stroke="url(#irisGrad)" stroke-width="4" opacity="0.3" filter="url(#glow)"/>
    <!-- Outer Orbit Ring -->
    <circle cx="120" cy="120" r="80" fill="none" stroke="url(#irisGrad)" stroke-width="5" stroke-dasharray="320 80"/>
    <!-- Middle Iris Ring -->
    <circle cx="120" cy="120" r="56" fill="none" stroke="#38BDF8" stroke-width="6" opacity="0.8"/>
    <!-- Inner Ring -->
    <circle cx="120" cy="120" r="34" fill="none" stroke="#C084FC" stroke-width="4"/>
    <!-- Core Center Sphere -->
    <circle cx="120" cy="120" r="18" fill="url(#irisGrad)" filter="url(#glow)"/>
  </g>

  <!-- Content Typography -->
  <g transform="translate(460, 160)">
    <!-- Category Badge/Tag -->
    <rect x="0" y="-32" width="190" height="28" rx="14" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="95" y="-13" text-anchor="middle" class="tag">ANDROID 14 • AOSP</text>

    <!-- Main Title -->
    <text x="0" y="65" class="title">Iris<tspan fill="#38BDF8">OS</tspan></text>

    <!-- Tagline / Subtitle -->
    <text x="0" y="115" class="subtitle">Convergência entre Celular e Computador</text>
    <text x="0" y="148" class="subtitle" font-size="18" fill="#64748B">Baseado na estabilidade e segurança oficial do LineageOS 21.0</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#irisGrad)"/>
</svg>
